<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="葉先博 Kevin 的新芽 Y 標誌"><style>.stem{stroke-dasharray:36 60;stroke-dashoffset:36;animation:stem 0.45s cubic-bezier(.22,.8,.3,1) 0.05s both,seed 0.12s linear both}.leaf{transform-origin:52px 52px;animation:leaf 0.55s cubic-bezier(.34,1.56,.64,1) 0.3s both}.leafsway{transform-origin:52px 52px;animation:sway 0.6500000000000001s ease-in-out 0.95s both}.sprout{transform-origin:48px 54px;animation:sprout 0.5s cubic-bezier(.34,1.9,.6,1) 0.55s both}@keyframes seed{from{opacity:0}to{opacity:1}}@keyframes stem{to{stroke-dashoffset:0}}@keyframes leaf{from{transform:scale(0) rotate(-40deg)}to{transform:none}}@keyframes sway{0%,100%{transform:none}35%{transform:rotate(-6deg)}70%{transform:rotate(2deg)}}@keyframes sprout{from{transform:scale(0) rotate(35deg)}to{transform:none}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}</style><path class="stem" d="M50 90 L50 54" fill="none" stroke="#1f6f66" stroke-width="8" stroke-linecap="round"/><g class="leafsway"><path class="leaf" d="M52 52 C51.3 30.9 66.6 14.7 86 16 C88.4 35.3 73.1 51.5 52 52 Z M55.808 49.746 L79.808 23.746 A1.1 1.1 0 0 0 78.192 22.254 L54.192 48.254 A1.1 1.1 0 0 0 55.808 49.746 Z" fill="#1f6f66" fill-rule="evenodd"/></g><path class="sprout" d="M48 54 C32.1 54.3 19.5 42.6 20 28 C34.5 26.4 47.1 38.1 48 54 Z" fill="#f4b43a"/></svg>
